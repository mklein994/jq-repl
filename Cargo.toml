[package]
name = "jq-repl"
version = "0.28.3"
description = "Interactively explore JSON with fzf and jq."
license = "MIT"
edition = "2024"
default-run = "jq-repl"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.4", features = ["cargo", "deprecated", "derive", "env", "wrap_help"] }
clap_complete = "4.5.58"
directories = "6.0.0"
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shell-quote = "0.8.0"
tabwriter = "1.4.1"
tempfile = "3.10.1"
thiserror = "2.0.18"
toml = "1.0.6"

[dev-dependencies]
insta = "1.39.0"
